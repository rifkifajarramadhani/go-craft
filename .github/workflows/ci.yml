name: CI

on:
  push:
  pull_request:

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: true
      - run: go test ./...
      - run: go vet ./...

  generated-pairwise:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: nethttp, database: mysql, queue: none, search: none, scheduler: '' }
          - { framework: fiber, database: postgres, queue: database, search: elasticsearch, scheduler: '' }
          - { framework: gin, database: sqlite, queue: redis, search: none, scheduler: --scheduler }
          - { framework: echo, database: mysql, queue: database, search: elasticsearch, scheduler: --scheduler }
          - { framework: nethttp, database: postgres, queue: redis, search: elasticsearch, scheduler: '' }
          - { framework: fiber, database: sqlite, queue: none, search: none, scheduler: '' }
          - { framework: gin, database: mysql, queue: database, search: elasticsearch, scheduler: --scheduler }
          - { framework: echo, database: postgres, queue: none, search: none, scheduler: '' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: true
      - run: go build -o go-craft ./cmd/go-craft
      - run: >-
          ./go-craft new generated
          --module=example.com/generated
          --directory=${{ runner.temp }}
          --framework=${{ matrix.framework }}
          --database=${{ matrix.database }}
          --queue=${{ matrix.queue }}
          --search=${{ matrix.search }}
          ${{ matrix.scheduler }}
          --no-interaction
      - working-directory: ${{ runner.temp }}/generated
        run: go test ./...
      - working-directory: ${{ runner.temp }}/generated
        run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - working-directory: ${{ runner.temp }}/generated
        run: govulncheck ./...

  elasticsearch-adapter-integration:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          xpack.security.http.ssl.enabled: 'false'
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: true
      - run: go build -o go-craft ./cmd/go-craft
      - run: >-
          ./go-craft new elasticsearch-project
          --module=example.com/elasticsearch-project
          --directory=${{ runner.temp }}
          --framework=nethttp
          --database=sqlite
          --queue=none
          --search=elasticsearch
          --no-interaction
      - working-directory: ${{ runner.temp }}/elasticsearch-project
        env:
          ELASTICSEARCH_TEST_URL: http://localhost:9200
        run: go test ./internal/adapter/elasticsearch -run Integration -count=1

  database-queue-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: db_name
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptest-password"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: db_name
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d db_name"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: true
      - run: go build -o go-craft ./cmd/go-craft
      - run: >-
          ./go-craft new mysql-project
          --module=example.com/mysql-project
          --directory=${{ runner.temp }}
          --framework=fiber
          --database=mysql
          --queue=database
          --no-interaction
      - run: >-
          ./go-craft new postgres-project
          --module=example.com/postgres-project
          --directory=${{ runner.temp }}
          --framework=nethttp
          --database=postgres
          --queue=database
          --no-interaction
      - run: go install -tags 'mysql postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      - run: migrate -database 'mysql://root:test-password@tcp(localhost:3306)/db_name' -path '${{ runner.temp }}/mysql-project/internal/adapter/mysql/migrations' up
      - run: migrate -database 'postgres://postgres:test-password@localhost:5432/db_name?sslmode=disable' -path '${{ runner.temp }}/postgres-project/internal/adapter/postgres/migrations' up
      - working-directory: ${{ runner.temp }}/mysql-project
        env:
          QUEUE_TEST_MYSQL_DSN: root:test-password@tcp(localhost:3306)/db_name?parseTime=true
        run: go test ./internal/adapter/queue -run DatabaseQueue -count=1
      - working-directory: ${{ runner.temp }}/postgres-project
        env:
          QUEUE_TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=test-password dbname=db_name sslmode=disable
        run: go test ./internal/adapter/queue -run PostgresDatabaseQueue -count=1
